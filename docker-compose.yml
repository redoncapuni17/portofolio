services:
  web:
    image: node:24-alpine
    working_dir: /app
    # Installs dependencies (no-op when up to date) and starts the Next.js dev server.
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env.local
    environment:
      # Bind mounts on Windows/macOS do not always emit file events; polling keeps HMR reliable.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    tty: true
